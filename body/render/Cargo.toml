[package]
name = "eye-render"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "parity"
path = "src/bin/parity.rs"
required-features = ["gpu"]

[features]
default = ["gpu"]
gpu = ["dep:glow", "dep:khronos-egl", "dep:libloading"]

[dependencies]
x11rb = { version = "=0.13.2", features = ["allow-unsafe-code", "xfixes", "randr", "shm"] }
cairo-rs = { version = "=0.20.7", features = ["xcb", "png"] }
pangocairo = "=0.20.7"
pango = "=0.20.12"
glow = { version = "0.16", optional = true }
khronos-egl = { version = "6", features = ["dynamic"], optional = true }
libloading = { version = "0.8", optional = true }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
