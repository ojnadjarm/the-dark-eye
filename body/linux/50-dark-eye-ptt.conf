# The Dark Eye (E08) — earbud push-to-talk. Installed by bridge/install.sh into
# ~/.config/wireplumber/wireplumber.conf.d/.
# The sidecar switches the buds to HFP itself while the mic is open, so WirePlumber
# must not autoswitch behind its back.
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}
# PipeWire's HFP gateway fakes an active call (+CIEV call=1) whenever the SCO link is
# up. In a call the WF-1000XM5 turn the double tap into an HFP hang-up that PipeWire
# swallows, so the closing tap never reached evdev. Without the dummy call the buds
# stay in media mode and keep sending AVRCP keys.
monitor.bluez.rules = [
  {
    matches = [ { device.name = "~bluez_card.*" } ]
    actions = { update-props = { bluez5.disable-dummy-call = true } }
  }
]
