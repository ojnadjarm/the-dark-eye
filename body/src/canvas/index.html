<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- agent content renders ONLY inside the sandboxed iframe below; this page
     itself runs no remote code -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; frame-src data: about:">
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #050807; color: #9fffc8;
    font: 13px Consolas, monospace;
  }
  #chrome {
    display: flex; align-items: center; gap: 10px;
    height: 38px; padding: 0 12px;
    background: #070c0a; border-bottom: 1px solid #143826;
    -webkit-app-region: drag; user-select: none;
  }
  #dot { width: 10px; height: 10px; border-radius: 50%; background: #4dffa0; flex: none; }
  #who { color: #6fdca4; flex: none; }
  #title { color: #eafff2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #queue { color: #2f9e63; flex: none; margin-left: auto; }
  #chrome button {
    -webkit-app-region: no-drag; flex: none;
    background: transparent; color: inherit; font: inherit;
    border: 1px solid #1a5438; border-radius: 3px;
    padding: 4px 12px; cursor: pointer;
  }
  #chrome button:hover { background: #0c1f15; }
  #approve { color: #ffd166; border-color: #6b5624; }
  #approve:hover { background: #241d0a; }
  #reject { color: #ff3b4d; border-color: #6b1c24; }
  #reject:hover { background: #240a0d; }
  #close { border: none; padding: 4px 8px; color: #4a7a5e; }
  #stage { position: absolute; inset: 38px 0 44px 0; }
  #stage iframe { width: 100%; height: 100%; border: 0; background: #fff; }
  #stage img { max-width: 100%; max-height: 100%; display: block; margin: 0 auto; object-fit: contain; }
  #stage pre {
    margin: 0; padding: 20px; height: 100%; box-sizing: border-box;
    overflow: auto; white-space: pre-wrap; color: #9fffc8;
  }
  #empty {
    position: absolute; inset: 38px 0 44px 0;
    display: flex; align-items: center; justify-content: center;
    color: #2f9e63; letter-spacing: 0.2em;
  }
  #bar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 44px;
    display: flex; align-items: center; gap: 8px; padding: 0 10px;
    background: #070c0a; border-top: 1px solid #143826; box-sizing: border-box;
  }
  #to { flex: none; color: #6fdca4; white-space: nowrap; }
  #todot { width: 8px; height: 8px; border-radius: 50%; background: #b04dff; flex: none; }
  #chat {
    flex: 1; background: #030a06; color: #eafff2; font: inherit;
    border: 1px solid #143826; border-radius: 3px; padding: 6px 10px; outline: none;
  }
  #chat:focus { border-color: #2f9e63; }
  #note { flex: none; color: #2f9e63; max-width: 30%; overflow: hidden;
          text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<div id="chrome">
  <div id="dot"></div>
  <span id="who"></span>
  <span id="title"></span>
  <span id="queue"></span>
  <button id="approve">approve</button>
  <button id="reject">reject</button>
  <button id="dismiss">dismiss</button>
  <button id="later">later</button>
  <button id="close">✕</button>
</div>
<div id="stage"></div>
<div id="empty">⟨ nothing on the canvas — the chat below still works ⟩</div>
<div id="bar">
  <div id="todot"></div>
  <span id="to">→ deep</span>
  <input id="chat" placeholder="type to the active brain — Enter sends, Ctrl+V pastes an image" spellcheck="false">
  <span id="note"></span>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  let current = null;

  function render(item) {
    current = item;
    const stage = $('stage');
    stage.textContent = '';
    if (!item) {
      $('empty').style.display = 'flex';
      $('who').textContent = '';
      $('title').textContent = '';
      $('queue').textContent = '';
      $('dot').style.background = '#4dffa0';
      for (const b of ['approve', 'reject', 'dismiss', 'later']) $(b).style.display = 'none';
      return;
    }
    $('empty').style.display = 'none';
    $('dot').style.background = item.color || '#9db4ff';
    $('who').textContent = '⟨ ' + item.session + ' ⟩';
    $('title').textContent = item.title;
    $('queue').textContent = item.queued > 1 ? item.queued - 1 + ' more waiting' : '';
    // approve/reject exist only when the sender asked for a decision;
    // everything else is just looked at and dismissed
    $('approve').style.display = item.verdict ? '' : 'none';
    $('reject').style.display = item.verdict ? '' : 'none';
    $('dismiss').style.display = item.verdict ? 'none' : '';
    $('later').style.display = '';
    if (item.kind === 'image') {
      const img = document.createElement('img');
      img.src = item.data;
      stage.appendChild(img);
    } else if (item.kind === 'html') {
      const f = document.createElement('iframe');
      // scripts may run, but in a unique origin with no bridge to anything
      f.setAttribute('sandbox', 'allow-scripts');
      f.srcdoc = item.data;
      stage.appendChild(f);
    } else {
      const pre = document.createElement('pre');
      pre.textContent = item.data;
      stage.appendChild(pre);
    }
  }

  $('approve').onclick = () => current && window.canvasApi.verdict(current.id, 'approved');
  $('reject').onclick = () => current && window.canvasApi.verdict(current.id, 'rejected');
  $('dismiss').onclick = () => current && window.canvasApi.verdict(current.id, 'dismissed');
  $('later').onclick = () => window.canvasApi.close();
  $('close').onclick = () => window.canvasApi.close();
  window.canvasApi.onItem(render);

  // -- the chat bar: typed words and pasted images go to the active brain ----
  const chat = $('chat');
  let noteTimer = null;
  function note(text) {
    $('note').textContent = text;
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => { $('note').textContent = ''; }, 4000);
  }
  chat.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && chat.value.trim()) {
      window.canvasApi.chat(chat.value.trim());
      note('sent');
      chat.value = '';
    }
  });
  window.addEventListener('paste', async (e) => {
    const items = [...(e.clipboardData?.items ?? [])];
    const img = items.find((it) => it.type.startsWith('image/'));
    if (!img) return; // plain text pastes into the input normally
    e.preventDefault();
    const buf = await img.getAsFile().arrayBuffer();
    window.canvasApi.paste(new Uint8Array(buf));
    note('sending image…');
  });
  window.canvasApi.onSession((s) => {
    $('to').textContent = '→ ' + s.active;
    $('todot').style.background = s.color || '#b04dff';
  });
  window.canvasApi.onNote(note);
  render(null);
</script>
</body>
</html>
